name: Issue Lifecycle Manager

on:
  issues:
    types: [opened, closed, labeled, unlabeled]

permissions:
  issues: write

jobs:
  auto-label:
    name: Auto Label Manager
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Manage Issue Labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || '';
            const body = issue.body || '';

            // Sorumlu Ekip secimine gore team:X etiketi ata
            if (body) {
              const teamMatch = body.match(/### Sorumlu Ekip\s*\r?\n\r?\n([^\r\n]+)/);
              if (teamMatch) {
                const teamValue = teamMatch[1].trim();
                if (teamValue) {
                  const teamLabel = `team:${teamValue}`;
                  try {
                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      labels: [teamLabel]
                    });
                    console.log(`Ekibin etiketi eklendi: ${teamLabel}`);
                  } catch (e) {
                    console.log(`Etiket eklenemedi (mevcut olmayabilir): ${teamLabel}`);
                  }
                }
              }
            }

            // QV acildiginda sonuca gore etiket ata ve ilgili TR'yi guncelle
            if (title.startsWith('[QV]') && body) {
              const resultMatch = body.match(/### Genel Sonuç\s*\r?\n\r?\n([^\r\n]+)/);
              const taskMatch = body.match(/### İlgili Görev \(TR\)\s*\r?\n\r?\n#?(\d+)/);
              const result = resultMatch ? resultMatch[1].trim() : '';

              let eventLabel = '';
              let parentState = '';
              if (result.startsWith('GEÇTİ')) {
                eventLabel = 'event:test-geçti';
                parentState = 'state:yayınlanmış';
              } else if (result.startsWith('KALDI')) {
                eventLabel = 'event:test-kaldı';
                parentState = 'state:başladı';
              }

              if (eventLabel) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    labels: [eventLabel]
                  });
                  console.log(`QV sonuc etiketi eklendi: ${eventLabel}`);
                } catch (e) {
                  console.log(`QV sonuc etiketi eklenemedi: ${eventLabel}`);
                }

                if (taskMatch && parentState) {
                  const taskNum = parseInt(taskMatch[1]);
                  try {
                    const task = await github.rest.issues.get({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: taskNum
                    });
                    const taskLabels = task.data.labels.map(l => l.name);
                    const newTaskLabels = taskLabels.filter(l => !l.startsWith('state:'));
                    newTaskLabels.push(parentState);

                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: taskNum,
                      labels: newTaskLabels
                    });

                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: taskNum,
                      body: result.startsWith('GEÇTİ')
                        ? `✅ **QA doğrulama başarılı**\n\nQV: #${issue.number}\n\nDurum: → ${parentState}`
                        : `❌ **QA doğrulama başarısız**\n\nQV: #${issue.number}\n\nDurum: → ${parentState}`
                    });

                    console.log(`Ilgili task #${taskNum} ${parentState} olarak guncellendi`);
                  } catch (e) {
                    console.log(`Ilgili task bulunamadi: #${taskNum}`);
                  }
                }
              } else if (result.startsWith('ENGELLİ')) {
                console.log('QV ENGELLİ durumunda; etiket atanmadi.');
              }
            }

            // Yeni BR acildiginda ilgili task'a hata etiketi at ve revizyona gecir
            if (title.startsWith('[BR]') && body) {
              const taskMatch = body.match(/### İlgili Görev \(TR\)\s*\r?\n\r?\n#?(\d+)/);
              if (taskMatch) {
                const taskNum = parseInt(taskMatch[1]);
                try {
                  const task = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: taskNum
                  });

                  const taskLabels = task.data.labels.map(l => l.name);
                  const newTaskLabels = taskLabels.filter(l => !l.startsWith('state:'));
                  if (!newTaskLabels.includes('type:hata')) {
                    newTaskLabels.push('type:hata');
                  }
                  newTaskLabels.push('state:revizyon');

                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: taskNum,
                    labels: newTaskLabels
                  });

                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: taskNum,
                    body: `🐞 **Hata raporu açıldı**\n\nHata raporu: #${issue.number}\n\nDurum: → state:revizyon`
                  });

                  console.log(`Task #${taskNum} type:hata + state:revizyon olarak guncellendi`);
                } catch (e) {
                  console.log(`Ilgili task bulunamadi: #${taskNum}`);
                }
              }
            }

            // Yeni RR acildiginda ilgili issue'yu revizyona gecir
            if (title.startsWith('[RR]') && body) {
              const match = issue.body.match(/#(\d+)/);
              if (match) {
                const parentIssueNum = parseInt(match[1]);
                try {
                  const parent = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentIssueNum
                  });

                  const parentLabels = parent.data.labels.map(l => l.name);
                  const newLabels = parentLabels.filter(l => !l.startsWith('state:'));
                  newLabels.push('state:revizyon');

                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentIssueNum,
                    labels: newLabels
                  });

                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentIssueNum,
                    body: `🔄 **Revizyon başlatıldı**\n\nRevizyon talebi: #${context.issue.number}\n\nDurum: state:revizyon`
                  });

                  console.log(`Issue #${parentIssueNum} state:revizyon olarak güncellendi`);
                } catch (e) {
                  console.log(`Ilgili issue bulunamadi: #${parentIssueNum}`);
                }
              }
            }

  on-rr-closed:
    name: On RR Closed
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Handle RR Close
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || '';

            // RR kapatildiginda ilgili issue'yu basladi'ya gecir
            if (title.startsWith('[RR]') && issue.body) {
              const match = issue.body.match(/#(\d+)/);
              if (match) {
                const parentIssueNum = parseInt(match[1]);
                try {
                  const parent = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentIssueNum
                  });

                  const parentLabels = parent.data.labels.map(l => l.name);
                  const newLabels = parentLabels.filter(l => !l.startsWith('state:'));
                  newLabels.push('state:başladı');

                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentIssueNum,
                    labels: newLabels
                  });

                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentIssueNum,
                    body: `✅ **Revizyon tamamlandı**\n\nRevizyon talebi kapatıldı: #${context.issue.number}\n\nDurum: state:revizyon → state:başladı`
                  });

                  console.log(`Issue #${parentIssueNum} state:başladı olarak güncellendi`);
                } catch (e) {
                  console.log(`Ilgili issue bulunamadi: #${parentIssueNum}`);
                }
              }
            }

  on-approve:
    name: On Approve
    runs-on: ubuntu-latest
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'state:onaylı'
    steps:
      - name: Notify Approval
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: '✅ **Talep onaylandı**\n\nBir sonraki adım: state:atanmış etiketi eklenecek ve görev ilgili kişiye atanacaktır.'
            });

  on-test-result:
    name: On Test Result
    runs-on: ubuntu-latest
    if: >
      github.event.action == 'labeled' &&
      (github.event.label.name == 'event:test-geçti' || github.event.label.name == 'event:test-kaldı')
    steps:
      - name: Handle Test Result
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const label = github.event.label.name;

            if (label === 'event:test-geçti') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ **Testler başarılı**\n\nCI pipeline başarıyla tamamlandı. YAYINLANMIŞ adımına geçilebilir.'
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '❌ **Testler başarısız**\n\nTestlerde hata tespit edildi. Düzeltme için state:revizyon etiketi eklenebilir.'
              });
            }
