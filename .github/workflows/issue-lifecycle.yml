name: Issue Lifecycle Manager

on:
  issues:
    types: [opened, closed, labeled, unlabeled]

permissions:
  issues: write

jobs:
  auto-label:
    name: Auto Label Manager
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Manage Issue Labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || '';

            // Yeni RR acildiginda ilgili issue'yu revizyona gecir
            if (title.startsWith('[RR]') && issue.body) {
              const match = issue.body.match(/#(\d+)/);
              if (match) {
                const parentIssueNum = parseInt(match[1]);
                try {
                  const parent = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentIssueNum
                  });

                  const parentLabels = parent.data.labels.map(l => l.name);
                  const newLabels = parentLabels.filter(l => !l.startsWith('state:'));
                  newLabels.push('state:revizyon');

                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentIssueNum,
                    labels: newLabels
                  });

                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentIssueNum,
                    body: `🔄 **Revizyon baslatildi**\n\nRevizyon talebi: #${context.issue.number}\n\nDurum: state:revizyon`
                  });

                  console.log(`Issue #${parentIssueNum} state:revizyon olarak guncellendi`);
                } catch (e) {
                  console.log(`Ilgili issue bulunamadi: #${parentIssueNum}`);
                }
              }
            }

  on-rr-closed:
    name: On RR Closed
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Handle RR Close
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || '';

            // RR kapatildiginda ilgili issue'yu basladi'ya gecir
            if (title.startsWith('[RR]') && issue.body) {
              const match = issue.body.match(/#(\d+)/);
              if (match) {
                const parentIssueNum = parseInt(match[1]);
                try {
                  const parent = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentIssueNum
                  });

                  const parentLabels = parent.data.labels.map(l => l.name);
                  const newLabels = parentLabels.filter(l => !l.startsWith('state:'));
                  newLabels.push('state:basladi');

                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentIssueNum,
                    labels: newLabels
                  });

                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentIssueNum,
                    body: `✅ **Revizyon tamamlandi**\n\nRevizyon talebi kapatildi: #${context.issue.number}\n\nDurum: state:revizyon → state:basladi`
                  });

                  console.log(`Issue #${parentIssueNum} state:basladi olarak guncellendi`);
                } catch (e) {
                  console.log(`Ilgili issue bulunamadi: #${parentIssueNum}`);
                }
              }
            }

  on-approve:
    name: On Approve
    runs-on: ubuntu-latest
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'state:onayli'
    steps:
      - name: Notify Approval
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: '✅ **Talep onaylandi**\n\nBir sonraki adim: state:atanmis etiketi eklenecek ve gorev ilgili kisiye atanacaktir.'
            });

  on-test-result:
    name: On Test Result
    runs-on: ubuntu-latest
    if: >
      github.event.action == 'labeled' &&
      (github.event.label.name == 'event:test-passed' || github.event.label.name == 'event:test-failed')
    steps:
      - name: Handle Test Result
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const label = github.event.label.name;

            if (label === 'event:test-passed') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ **Testler basarili**\n\nCI pipeline basariyla tamamlandi. YAYIMLANMIS adimina gecilebilir.'
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '❌ **Testler basarisiz**\n\nTestlerde hata tespit edildi. Duzeltme icin state:revizyon etiketi eklenebilir.'
              });
            }
