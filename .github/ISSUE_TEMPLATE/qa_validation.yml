name: "QV - QA Doğrulama"
description: "Uygulanan işin kabul kriterlerini sağladığının QA tarafından doğrulanması"
title: "[QV] "
labels: ["state:test-plani", "type:doğrulama"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## QA Doğrulama Raporu

        Bu issue, tamamlanmış bir işin resmi QA doğrulamasını belgeler.
        Uygulama zaten mevcuttur — bu bir **doğrulama** kaydıdır, planlama kaydı değildir.
        Test planı ilgili görevde (TR) yer alır, burada tekrar edilmez.

        Kırmızı yıldız işaretli her alan zorunludur.

  - type: markdown
    attributes:
      value: "### 1. Referanslar"

  - type: input
    id: related-task
    attributes:
      label: "İlgili Görev (TR)"
      description: "Doğrulanan uygulamanın yer aldığı görev."
      placeholder: "#42"
    validations:
      required: true

  - type: input
    id: related-pr
    attributes:
      label: "İlgili PR"
      description: "Değişikliği uygulayan pull request."
      placeholder: "#128"
    validations:
      required: false

  - type: input
    id: qa-engineer
    attributes:
      label: "QA Mühendisi"
      description: "Bu doğrulamayı kim gerçekleştirdi?"
      placeholder: "@qa-kullanici"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 2. Test Ortamı"

  - type: input
    id: build-version
    attributes:
      label: "Yapı Sürümü"
      description: "Test edilen sürüm, etiket veya commit SHA."
      placeholder: "v2.1.0-rc.1 / main@a3f2c1b"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "Ortam"
      description: "Hangi ortamda test edildi?"
      options:
        - "Geliştirme"
        - "Önizleme (Staging)"
        - "Üretim (duman testi)"
        - "Sürekli Entegrasyon (CI)"
        - "Yerel (QA iş istasyonu)"
    validations:
      required: true

  - type: input
    id: test-date
    attributes:
      label: "Test Tarihi"
      description: "Doğrulama ne zaman yapıldı?"
      placeholder: "GG-AA-YYYY"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 3. Test Sonuçları"

  - type: markdown
    attributes:
      value: |
        İlgili görevdeki (TR) test planındaki her test senaryosu uygulandı.
        Atlanan bir senaryo varsa gerekçesiyle birlikte belirtin.

  - type: dropdown
    id: pass-fail
    attributes:
      label: "Genel Sonuç"
      description: "Uygulama tüm kabul kriterlerini sağlıyor mu?"
      options:
        - "GEÇTİ — Tüm kriterler sağlandı"
        - "GEÇTİ — Kritik kriterler sağlandı, kritik olmayan küçük sorunlar belgelendi"
        - "KALDI — Bir veya daha fazla kabul kriteri sağlanmadı"
        - "ENGELLİ — Doğrulama tamamlanamıyor (ortam çöktü, bağımlılık eksik)"
    validations:
      required: true

  - type: textarea
    id: failed-cases
    attributes:
      label: "Başarısız Senaryolar"
      description: "Başarısızlıkların detayı. Gerçekleşen ve beklenen durumu belirtin."
      placeholder: |
        - AC-4: Parola politikası uygulanmıyor
          Beklenen: "Test1234" parolası reddedilmeli (özel karakter yok)
          Gerçekleşen: Parola kabul edildi, kullanıcı oluşturuldu
          Önem: S3 (geçici çözüm mevcut)
        - AC-5: 12 mevcut auth testinden 2'si başarısız
          Testler: test_login_rate_limit, test_brute_force_detection
          Kök neden: Yeni middleware hız sınırlayıcıya karışıyor
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### 4. Kapsam ve Öneri"

  - type: dropdown
    id: regression-needed
    attributes:
      label: "Regresyon Testi Gerekli mi?"
      description: "Bu değişiklik kabul kriterlerinin ötesinde regresyon gerektiriyor mu?"
      options:
        - "Hayır — izole değişiklik, tam regresyon gerekmez"
        - "Evet — smoke regresyon önerilir (kritik yollar yeterli)"
        - "Evet — tam regresyon gereklidir (çekirdek altyapıya dokunuyor)"
        - "Belirsiz — Takım lideri karar vermeli"
    validations:
      required: true

  - type: textarea
    id: recommendation
    attributes:
      label: "Öneri"
      description: "Yukarıdaki sonuçlara dayalı QA'nın resmi önerisi."
      placeholder: |
        ONAYLANDI — Tüm kabul kriterleri geçti. Notlarda belgelenen küçük arayüz
        sorunu sürümü engellemiyor.

        VEYA

        ŞARTLI — AC-5 düzeltmesi (hız sınırlayıcı regresyonu) sonrası onay.
        Düzeltme basit; sadece auth test paketi çalıştırılmalı, tam regresyon değil.

        VEYA

        REDDEDİLDİ — AC-4 (parola politikası) ve AC-5 (test regresyonu) kritik
        başarısızlıklar. Yayın öncesi düzeltilip yeniden doğrulanmalı.
    validations:
      required: true

  - type: dropdown
    id: approval
    attributes:
      label: "QA Onayı"
      description: "Resmi onay kararı."
      options:
        - "Onaylandı — yayına hazır"
        - "Şartlı onay — öneriye bakınız"
        - "Onaylanmadı — yeniden çalışma gerektiriyor"
    validations:
      required: true

  - type: input
    id: approval-date
    attributes:
      label: "Onay Tarihi"
      description: "QA onayının tarihi."
      placeholder: "GG-AA-YYYY"
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### 5. Ek Bağlam"

  - type: textarea
    id: notes
    attributes:
      label: "Test Notları"
      description: "Gözlemler, test edilen sınır durumları, ortam sorunları, bilinen kısıtlar."
      placeholder: |
        - Staging ortamında (staging-42) PostgreSQL 16 ile test edildi
        - Hız limiti testi 3 dakika beklemeyi gerektirdi (hız penceresi)
        - Safari tarayıcısında sıfırlama sayfasında render sorunu görünüyor — önceden var, bu işte ortaya çıkmadı
        - Performans: sıfırlama akışı ~200ms'de tamamlanıyor (eşik: 500ms)
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### 6. Gönderim Kontrol Listesi

  - type: checkboxes
    id: checklist
    attributes:
      label: "Gönderim Öncesi Kontrol Listesi"
      options:
        - label: "Yapı sürümü ve ortam belgelendi"
          required: true
        - label: "İlgili görevdeki test planının tüm senaryoları uygulandı"
          required: true
        - label: "Başarısız senaryolar için gerçekleşen/beklenen ve önem düzeyi belirtildi"
          required: false
        - label: "Regresyon değerlendirmesi belgelendi"
          required: true
        - label: "Öneri ve onay kararı belirtildi"
          required: true
        - label: "Gizli veriler (kimlik bilgileri, token, PII) loglardan kaldırıldı"
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        **Bağlantı**: Bu QV issue'su ilgili göreve (#42) bağlanır.
        Onaylandığında ilgili görev "Yayına Hazır" durumuna geçer.

        **Yaşam Döngüsü**: TEST PLANI (oluşturuldu) → TEST (uygulama) →
        (GEÇTİ ise) YAYINLANMIŞ | (KALDI ise) ilgili görevde REVİZYON.
