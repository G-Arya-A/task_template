name: "ET - Engineering Task"
description: "Implementation task for an approved, scoped unit of work"
title: "[ET] "
labels: ["state:analiz", "type:task"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Engineering Task

        This task is already approved and scoped. Focus on *how* to implement
        correctly, with tests, within the defined scope. Every field marked
        with a red asterisk is required.

  - type: markdown
    attributes:
      value: "### 1. Overview"

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "Concise summary of what this task delivers. One paragraph max."
      placeholder: |
        Implement the password reset flow. Users request a reset, receive an
        email with a time-limited token, and set a new password. The existing
        auth service is extended — no new service required.
    validations:
      required: true

  - type: textarea
    id: technical-scope
    attributes:
      label: "Technical Scope"
      description: "What is in scope and what is explicitly out of scope."
      placeholder: |
        In scope:
        - New POST /auth/reset-request endpoint
        - Email sending via existing notification service
        - Token generation with 15min TTL (HMAC-based, stored in Redis)
        - New POST /auth/reset endpoint (token validation + password update)
        - Unit and integration tests

        Out of scope:
        - UI changes (separate frontend task)
        - Rate limiting (already handled by API gateway)
        - Password history / reuse check (separate security task)
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 2. Technical Details"

  - type: textarea
    id: files-modules
    attributes:
      label: "Files / Modules"
      description: "Specific files, modules, or packages that will be created or modified."
      placeholder: |
        Modified:
        - src/auth/service.py (extend AuthService)
        - src/auth/router.py (add new routes)
        - src/auth/schemas.py (request/response models)
        - tests/test_auth.py (add test cases)

        Created:
        - src/auth/reset.py (password reset logic)
        - tests/test_reset.py (dedicated reset tests)
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "What must exist before this task can start or complete?"
      placeholder: |
        Pre-requisites:
        - #128 – Notification service must support templated emails
        - Redis instance must be available in dev/staging (ops ticket #456)

        Blocked by:
        - (none)

        This task blocks:
        - #131 – Frontend password reset UI
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### 3. Quality Gates"

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance Criteria"
      description: "Specific, testable conditions that define success."
      placeholder: |
        - [ ] POST /auth/reset-request returns 202 (accepted) for valid and invalid emails (no enumeration)
        - [ ] Email is sent within 30 seconds for valid emails
        - [ ] Reset token expires after 15 minutes
        - [ ] POST /auth/reset with valid token sets new password and invalidates token
        - [ ] POST /auth/reset with expired token returns 410 (Gone)
        - [ ] POST /auth/reset with invalid token returns 401
      render: markdown
    validations:
      required: true

  - type: textarea
    id: test-plan
    attributes:
      label: "Test Plan"
      description: "How will this be tested? Unit, integration, e2e, manual?"
      placeholder: |
        Unit tests:
        - Token generation: valid token structure, expiry check
        - Token validation: valid, expired, tampered cases
        - Password update: success, weak password rejection

        Integration tests:
        - Full reset flow (request → receive → reset → login)
        - Duplicate reset request (invalidates previous token)
        - Email delivery through notification service mock

        Manual (QA):
        - Verify email lands in inbox (dev/staging SMTP)
        - Verify reset link works from mobile email client
        - Verify reset link in spam folder still works
    validations:
      required: true

  - type: textarea
    id: definition-of-done
    attributes:
      label: "Definition of Done"
      description: "Checklist that must be fully satisfied before this task can be closed."
      value: |
        - [ ] Code implements all acceptance criteria
        - [ ] All unit and integration tests pass (CI green)
        - [ ] Test coverage meets team threshold (>= 80%)
        - [ ] PR reviewed and approved by at least one peer
        - [ ] No new security warnings from linter/bandit
        - [ ] API documentation updated (if public endpoint)
        - [ ] Migration scripts tested rollback
        - [ ] Feature flag toggles documented (if applicable)
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### 4. Planning"

  - type: input
    id: target-version
    attributes:
      label: "Target Version"
      description: "Which release should this ship in?"
      placeholder: "v2.1.0"
    validations:
      required: false

  - type: input
    id: communication-channel
    attributes:
      label: "Communication Channel"
      description: "Where to ask questions about this task."
      placeholder: "Slack: #team-auth, PR comments"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: "Technical Notes"
      description: "Architecture decisions, design patterns, gotchas, prior art."
      placeholder: |
        - Use the existing HMAC helper in src/common/crypto.py (do not reimplement)
        - Token TTL is configurable via AUTH_RESET_TTL env var (default: 900s)
        - Rate limiting for reset-request is handled by API gateway (config: 3/min per IP)
        - See #42 for the original auth service design discussion
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Pre-submission Checklist"
      options:
        - label: "Technical scope is clear and bounded"
          required: true
        - label: "All affected files/modules are identified"
          required: true
        - label: "Acceptance criteria are specific and testable"
          required: true
        - label: "Test plan covers unit, integration, and manual scenarios"
          required: true
        - label: "Dependencies are documented"
          required: false

  - type: markdown
    attributes:
      value: |
        ---
        **Assignee** and **Milestone** — set these in the sidebar after creation.

        **Lifecycle**: ANALISIS → READY → DEVELOPMENT → CODE REVIEW → TESTING → RELEASED
        This task is pre-approved. Move to READY once dependency [issue/PR] is resolved.
