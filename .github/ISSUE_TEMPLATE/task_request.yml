name: "TR - Görev Talebi (Ticket)"
description: "Yeni görev talebi oluştur (özellik, hata, refactor, araştırma, risk azaltma, iş gereksinimi, soru)"
title: "[TR] "
labels: ["state:analiz", "type:görev", "priority:P3"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Görev Talebi Formu
        Lütfen aşağıdaki alanları eksiksiz doldurunuz.
        Tüm zorunlu alanları doldurmadan talep göndermeyiniz.
        **Türüne göre** alanlar değişir; size uymayan alanları "—" ile işaretleyin.

  - type: markdown
    attributes:
      value: "### 1. Temel Bilgiler"

  - type: input
    id: requester
    attributes:
      label: "Talep Sahibi"
      description: "Bu görevi kim talep ediyor?"
      placeholder: "Ad Soyad veya Kullanıcı Adı"
    validations:
      required: true

  - type: dropdown
    id: request_type
    attributes:
      label: "Talep Türü"
      description: "Bu talebin türü nedir?"
      options:
        - "Yeni Özellik"
        - "Hata Düzeltme"
        - "Kod/Yapı Yeniden Düzenleme"
        - "Araştırma/Keşif (zaman kutusu)"
        - "Risk Azaltma"
        - "İş Gereksinimi"
        - "Soru / Açıklama"
        - "Diğer"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Öncelik Seviyesi"
      description: "Bu görevin önceliği nedir?"
      options:
        - "P1 - Kritik (Acil, sistem durdurucu)"
        - "P2 - Yüksek (Mühim, kısa sürede yapılmalı)"
        - "P3 - Orta (Normal plan dahilinde)"
        - "P4 - Düşük (İyileştirme, fırsat olduğunda)"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 2. İş Gereksinimi"

  - type: textarea
    id: business_requirement
    attributes:
      label: "İş Gereksinimi"
      description: "Bu işin arkasındaki iş ihtiyacı nedir? Hangi iş problemi çözülüyor?"
      placeholder: |
        İş problemi: ...
        Hedeflenen iş sonucu: ...
        İş paydaşları: ...
        Kabul edilebilir iş etkisi/kısıtlar: ...
    validations:
      required: true

  - type: textarea
    id: business_value
    attributes:
      label: "İş Değeri / Gerekçe"
      description: "Bu iş neden yapılmalı? Ölçülebilir faydası nedir?"
      placeholder: "Örn: maliyet azaltma, gelir artışı, risk azaltma, müşteri memnuniyeti..."
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 3. Teknik Kapsam"

  - type: textarea
    id: description
    attributes:
      label: "Teknik Açıklama"
      description: "Yapılacak işin teknik detayı"
      placeholder: "Ne yapılacak, hangi modüller, nasıl yapılacak?"
    validations:
      required: true

  - type: textarea
    id: scope_in
    attributes:
      label: "Kapsam"
      description: "Bu iş kapsamında neler var?"
      placeholder: |
        - Modül 1: ...
        - Modül 2: ...
    validations:
      required: false

  - type: textarea
    id: spike_questions
    attributes:
      label: "Araştırma Soruları"
      description: "Araştırma/keşif türünde: zaman kutusu ne kadar? Hangi sorulara cevap aranacak?"
      placeholder: |
        Zaman kutusu: 2 gün
        Soru 1: ...
        Soru 2: ...
        Çıktı: karar notu / prototip / karşılaştırma
    validations:
      required: false

  - type: textarea
    id: questions
    attributes:
      label: "Açık Sorular / Bekleyen Kararlar"
      description: "Henüz netleşmemiş sorular, cevaplanması gereken noktalar"
      placeholder: |
        - Q1: ... -> cevap veren: @kişi
        - Q2: ... -> cevap veren: @kişi
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### 4. Risk ve Geri Dönüş"

  - type: textarea
    id: risks
    attributes:
      label: "Riskler ve Azaltma Önlemleri"
      description: "Bu işin getirebileceği riskler ve bunları azaltma planı"
      placeholder: |
        - Risk 1: ... -> Olasılık/Y etkisi: ... -> Azaltma: ...
        - Risk 2: ... -> Azaltma: ...
    validations:
      required: true

  - type: input
    id: original_version_backup
    attributes:
      label: "Orijinal Sürüm Yedeği"
      description: "Değişiklik öncesi mevcut sürümün yedeği nerede tutuluyor? (tag, branch, dosya yolu)"
      placeholder: "örn: v1.2.0 / backup/2026-08-01 / main@abc1234"
    validations:
      required: true

  - type: textarea
    id: rollback_plan
    attributes:
      label: "Geri Dönüş Planı"
      description: "Sorun çıkarsa eski sürüme nasıl dönülür?"
      placeholder: "Geri alma adımları: ..."
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### 5. Kabul Kriterleri"

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Kabul Kriterleri"
      description: "Bu görevin başarılı sayılması için gereken koşullar (test edilebilir olmalı)"
      placeholder: |
        - [ ] AC-1: ...
        - [ ] AC-2: ...
        - [ ] AC-3: ...
      value: "- [ ] "
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 6. Test Planı"

  - type: textarea
    id: test_plan
    attributes:
      label: "Test Planı"
      description: "Bu görevin başarılı olduğunu doğrulamak için uygulanacak test senaryoları"
      placeholder: |
        - [ ] T-1: ... -> Beklenen sonuç: ...
        - [ ] T-2: ... -> Beklenen sonuç: ...
        - [ ] T-3: ... -> Beklenen sonuç: ...
      value: "- [ ] "
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 7. Organizasyon"

  - type: dropdown
    id: assigned_team
    attributes:
      label: "Sorumlu Ekip"
      description: "Bu görev hangi ekip tarafından yapılmalıdır?"
      options:
        - "PY"
        - "AYG"
        - "FYYG"
        - "GSYG"
        - "IMYG"
        - "K2"
        - "OYG"
        - "PSYG"
        - "SSYG"
        - "SYG"
        - "YMG"
        - "YSYG"
        - "YTO"
        - "ST"
        - "SSG-STAGY"
    validations:
      required: true

  - type: input
    id: assigned_to
    attributes:
      label: "Atanacak Kişi(ler)"
      description: "Görev kime atanacak? (Takım lideri onayı sonrası)"
      placeholder: "@kullanici1, @kullanici2"
    validations:
      required: false

  - type: input
    id: deadline
    attributes:
      label: "Son Tarih"
      description: "Bu görevin bitiş tarihi nedir?"
      placeholder: "YYYY-MM-DD"
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: "Bağımlılıklar"
      description: "Bu göreve bağlı olan veya bu göreve bağımlı olan diğer görevler"
      placeholder: |
        - #123 - İlgili görev
        - #456 - Bağımlı görev
    validations:
      required: false

  - type: textarea
    id: related_docs
    attributes:
      label: "İlgili Dokümanlar"
      description: "Bu görevle ilgili dokümanlar, linkler"
      placeholder: |
        - [Doküman Adı](link)
        - [Spec](link)
    validations:
      required: false

  - type: textarea
    id: communication
    attributes:
      label: "İletişim Kanalı"
      description: "Bu görevle ilgili iletişim için kullanılacak kanal"
      placeholder: |
        Chat Linki: [link]
        Kanal Adı: #proje-adi
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### 8. Notlar"

  - type: textarea
    id: notes
    attributes:
      label: "Ek Notlar"
      description: "Eklemek istediğiniz notlar, kısıtlar, varsayımlar"
      placeholder: "Ek bilgiler, uyarılar, varsayımlar..."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Kontrol Listesi (Checklist)"
      description: "Görev oluştururken kontrol edilmesi gerekenler"
      options:
        - label: "İş gereksinimi tanımlı ve paydaşlar belirtildi"
          required: false
        - label: "Kabul kriterleri test edilebilir şekilde yazıldı"
          required: false
        - label: "Test planı kabul kriterlerini kapsıyor"
          required: false
        - label: "Riskler ve azaltma önlemleri listelendi"
          required: false
        - label: "Orijinal sürüm yedeği belirtildi"
          required: false
        - label: "Öncelik belirlendi"
          required: false
        - label: "İlgili kişiler bilgilendirildi"
          required: false
        - label: "Dokümanlar eklendi"
          required: false

  - type: markdown
    attributes:
      value: |
        ---
        **Durum Akışı**: ANALİZ → ONAYLI → ATANMIŞ → BAŞLAMADI → BAŞLADI → KOD GÖZDEN GEÇİRME → TEST PLANI → TEST → YAYIMLANMIŞ
        **Revizyon Gerekirse**: REVİZYON → (yeni issue açmadan) ilgili duruma geri dönüş
